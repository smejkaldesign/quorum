<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>Quorum</title>
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #1c1c1d; border-radius: 26px; transition: opacity 0.3s ease-out; }
      #boot span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: rgba(255, 255, 255, 0.75); animation: boot-spin 0.8s linear infinite; }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      html.popup-root #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
