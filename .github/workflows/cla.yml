name: CLA

# Asks each new contributor to sign CLA.md once, on their first pull request, by replying with one sentence. The
# signature records live on the cla-signatures branch of this repository; no app install and no extra token needed.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/smejkaldesign/quorum/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'smejkaldesign,dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be merged, please read the contributor license agreement at https://github.com/smejkaldesign/quorum/blob/main/CLA.md and reply to this comment with the sentence below. One signature covers all your later pull requests.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
