name: CLA

# Asks each new contributor to sign CLA.md once, on their first pull request, by replying with one sentence. The
# signature records live on the cla-signatures branch of this repository; no app install and no extra token needed.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target is required: on a fork's pull_request the token is read-only and the action could neither
# comment nor record a signature. This workflow never checks out or runs pull request code; the action reads the
# PR's commits and comments through the API only. Keep it that way: no actions/checkout, no run steps.
permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    # contents: write for the cla-signatures branch, pull-requests: write for the comments. actions: read lets the
    # action find its last run after a signature; it can no longer re-run that run (that needs actions: write), so a
    # maintainer re-runs the failed CLA check by hand once the contributor has signed. The action sets no commit
    # statuses, so it gets no statuses scope.
    permissions:
      actions: read
      contents: write
      pull-requests: write
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/smejkaldesign/quorum/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'smejkaldesign,dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be merged, please read the contributor license agreement at https://github.com/smejkaldesign/quorum/blob/main/CLA.md and reply to this comment with the sentence below. One signature covers all your later pull requests.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
