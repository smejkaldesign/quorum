name: Release

# A tag v<version> builds the Local edition, signs and notarizes it, and attaches the DMG, the zip the in-app updater
# downloads, and latest-mac.yml to a draft GitHub release for that tag. Publishing the draft is a manual step, so the
# notes can be read first; electron-updater ignores drafts.
#
# Repository secrets (docs/release-checklist.md has the gh commands):
#   CSC_LINK, CSC_KEY_PASSWORD            Developer ID Application certificate as a base64 .p12 and its password.
#                                         Without them the build is signed ad hoc, not notarized, and the release stays a dry run.
#   APPLE_API_KEY, APPLE_API_KEY_ID,      App Store Connect API key: the .p8 contents, its key id and the issuer id.
#   APPLE_API_ISSUER                      electron-builder notarizes the app with them and notarize-dmg.sh notarizes the image.
#   QUORUM_GOOGLE_CLIENT_ID,              Optional. The Google Calendar connector's Desktop OAuth client (docs/self-hosting.md).
#   QUORUM_GOOGLE_CLIENT_SECRET           Written into the packaged package.json as quorumGoogle; without them the connector asks for a client.
#
# The Cloud edition is packaged with `npm run package:cloud` and distributed from quorum.watch; it is not part of this
# workflow because it needs its own update feed first (docs/parity-gaps.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.QUORUM_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.QUORUM_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: The tag names the version in app/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./app/package.json').version")"
          [ "$tag" = "$version" ] || { echo "tag v$tag does not match app/package.json version $version"; exit 1; }

      - name: Build helper
        run: swift build -c release
        working-directory: helper
      - name: Install
        run: npm ci
        working-directory: app
      - name: Typecheck, test, founder content guard
        run: npm run typecheck && npm test && npm run check:content
        working-directory: app

      # electron-builder reads APPLE_API_KEY as a path to the .p8; the secret holds the file's contents
      - name: Write the App Store Connect key
        if: env.APPLE_API_KEY_ID != ''
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENTS" > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Signing status
        run: |
          if [ -n "$CSC_LINK" ]; then echo "::notice::Developer ID certificate present; the app will be signed and notarized."; else echo "::warning::CSC_LINK is not set; the app is signed ad hoc and not notarized. Set CSC_LINK and CSC_KEY_PASSWORD for a release build."; fi

      # the installed app cannot read a .env, so the Google client rides in its package.json the way the Cloud build's Supabase values do
      - name: Add the Google Calendar client
        if: env.GOOGLE_CLIENT_SECRET != ''
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.quorumGoogle={clientId:process.env.GOOGLE_CLIENT_ID||undefined,clientSecret:process.env.GOOGLE_CLIENT_SECRET};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('quorumGoogle set')"
        working-directory: app
      - name: Package the Local edition
        run: npm run package
        working-directory: app
        env:
          QUORUM_EDITION: local
          # with no certificate electron-builder must not go looking for one in the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Notarize and staple the DMG
        if: env.CSC_LINK != '' && env.APPLE_API_KEY_ID != ''
        run: zsh scripts/notarize-dmg.sh
        working-directory: app

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml out/ 2>/dev/null || true
          ls -la out
          shasum -a 256 out/*.dmg out/*.zip > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: quorum-mac
          path: app/out/*
          if-no-files-found: error

      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: app/out/*
