name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build helper
        run: swift build
        working-directory: helper
      - name: Test helper
        run: swift test
        working-directory: helper
      - name: Install
        run: npm ci
        working-directory: app
      - name: Typecheck
        run: npm run typecheck
        working-directory: app
      - name: Lint
        run: npm run lint
        working-directory: app
      - name: Test
        run: npm test
        working-directory: app
      - name: Founder content guard
        run: npm run check:content
        working-directory: app
      - name: Build local edition and check the ee boundary
        run: npm run build && npm run check:edition
        working-directory: app
      - name: Build cloud edition and check the ee boundary
        run: npm run build:cloud && npm run check:edition
        working-directory: app
        env:
          QUORUM_EDITION: cloud
      # the home page on quorum.watch shows this build; a renderer change that breaks it fails here, not on the site
      - name: Build the site's app preview
        run: npm run build:site-preview
        working-directory: app

  # the relay and the admin app are plain Node; they build and test on Linux, the same image Railway uses
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the relay imports the speech engines and the notes prompts from app/, so the app's modules have to be there
      - name: App modules for the relay
        run: npm ci
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Relay
        run: npm ci && npm test
        working-directory: relay
      # the image copies only what the root Dockerfile lists from app/; this imports the relay inside that same tree
      - name: Relay image imports
        run: npm run check:image
        working-directory: relay
      - name: Admin app
        run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: admin
        env:
          QUORUM_SUPABASE_URL: https://example.supabase.co
          QUORUM_SUPABASE_ANON_KEY: ci-placeholder

  gitleaks:
    runs-on: ubuntu-latest
    # pull_request runs list the PR's commits through the API, which the default token cannot do without this
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only when the repository belongs to an organization account; a personal account runs without it.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
